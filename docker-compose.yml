services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1
    container_name: triage-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${TRIAGE_SA_PASSWORD}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - triage-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: "no"

volumes:
  triage-sql-data:
    name: triage-sql-data

